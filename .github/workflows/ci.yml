name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Verify dependency pins
        run: ./script/check-dependencies.sh

      - name: Build
        run: forge build

      - name: Test
        run: forge test

      - name: Check Markdown
        run: ./script/check-markdown.sh
